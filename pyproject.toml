[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "v49writer"
version = "0.1.0"
description = "Receive VITA 49 (VRT) IQ streams over UDP/TCP and write Midas BLUE files"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
]

[project.scripts]
v49writer = "v49writer.cli:main"
v49gen = "v49writer.generator:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
